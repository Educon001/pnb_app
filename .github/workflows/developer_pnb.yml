# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - pnb

on:
  push:
    branches:
      - Developer
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r app deployment/
          cp package*.json deployment/
          cp server.js deployment/
          cp -r node_modules deployment/ 2>/dev/null || true

      - name: Archive deployment package
        run: |
          cd deployment
          zip -r ../deployment.zip . -x "*.git*" "*.test.js" "__tests__/*" "coverage/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip deployment.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FCCCA39EDBC741A7A17AAF6AAE6BDB72 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F4A1D35A5B41456CA18676903709090F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32000235971744F79EC010B1F93E21A8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pnb'
          slot-name: 'Production'
          package: .

      - name: Azure logout
        run: az logout
        if: always()
